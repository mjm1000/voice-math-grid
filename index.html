<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Math Grid (Live Room)</title>
  <style>
    :root {
      --bg: #121417;
      --panel: #1c2026;
      --cell: #252a33;
      --cell-active: #2d5be3;
      --border: #3a414e;
      --text: #f3f5f8;
      --muted: #aab2c0;
      --ok: #2ea043;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 8px;
    }

    .hint {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      background: var(--panel);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    button, label, input[type="text"] {
      font-size: 0.95rem;
    }

    input[type="text"] {
      background: #121417;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      width: 170px;
    }

    button {
      background: #2f3642;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }

    button:hover {
      background: #3b4454;
    }

    button.primary {
      background: var(--cell-active);
      border-color: #4f78f0;
    }

    .kbd {
      font-size: 0.78rem;
      color: #d6dde8;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: 4px;
    }

    .status {
      font-size: 0.9rem;
      color: var(--muted);
      margin-left: auto;
    }

    .status.connected {
      color: #7ee787;
    }

    .grid-wrap {
      overflow-x: auto;
      background: var(--panel);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }

    .row-label {
      width: 58px;
      color: var(--muted);
      font-size: 0.85rem;
      user-select: none;
    }

    .cell {
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cell);
      border: 2px solid var(--border);
      border-radius: 6px;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
      outline: none;
      user-select: none;
    }

    .cell.active {
      background: var(--cell-active);
      border-color: #9bb5ff;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Self-Voicing Math Grid</h1>
    <p class="hint">
      Click <strong>Enable Voice</strong> (<span class="kbd">Alt+V</span>) first. Shortcuts:
      <strong>Connect Room</strong> (<span class="kbd">Alt+C</span>),
      <strong>Read Row</strong> (<span class="kbd">Alt+R</span>),
      <strong>Copy Row Down</strong> (<span class="kbd">Alt+D</span>),
      <strong>Add Row</strong> (<span class="kbd">Alt+A</span>),
      <strong>Clear All</strong> (<span class="kbd">Alt+X</span>).
    </p>

    <div class="controls">
      <button id="enableVoiceBtn" class="primary" type="button" title="Shortcut: Alt+V">
        Enable Voice <span class="kbd">Alt+V</span>
      </button>
      <label>
        Room Code:
        <input id="roomInput" type="text" placeholder="e.g. grade9-4821" autocomplete="off" />
      </label>
      <button id="connectRoomBtn" type="button" title="Shortcut: Alt+C">
        Connect Room <span class="kbd">Alt+C</span>
      </button>
      <span id="roomStatus" class="status">Offline (local only)</span>
    </div>

    <div class="controls">
      <button id="readRowBtn" type="button" title="Shortcut: Alt+R">
        Read Row <span class="kbd">Alt+R</span>
      </button>
      <button id="copyRowBtn" type="button" title="Shortcut: Alt+D">
        Copy Row Down <span class="kbd">Alt+D</span>
      </button>
      <button id="addRowBtn" type="button" title="Shortcut: Alt+A">
        Add Row <span class="kbd">Alt+A</span>
      </button>
      <button id="clearGridBtn" type="button" title="Shortcut: Alt+X">
        Clear All <span class="kbd">Alt+X</span>
      </button>
      <label>
        Speed:
        <input id="rateSlider" type="range" min="0.6" max="1.6" step="0.1" value="1.0" />
        <span id="rateValue">1.0x</span>
      </label>
    </div>

    <div id="grid" class="grid-wrap" aria-label="Math equation grid"></div>
  </div>

  <!-- Supabase JS v2 from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Replace these two values with your Supabase Project URL and Publishable API key
    const SUPABASE_URL = "https://tjzwrqwyyokrnceoqvau.supabase.co";
   const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IbaR-DQ23P8myIDPxEE0Qw_8EC_toie";

    const NUM_ROWS = 6;

    const NUM_COLS = 14;

    const SYMBOL_NAMES = {
      "": "blank",
      "+": "plus",
      "-": "minus",
      "*": "times",
      "×": "times",
      "/": "divided by",
      "÷": "divided by",
      "=": "equals",
      "^": "to the power of",
      "(": "open parenthesis",
      ")": "close parenthesis",
      ".": "point"
    };

    const clientId = "peer-" + Math.random().toString(36).slice(2, 10);
    let rows = Array.from({ length: NUM_ROWS }, () => Array(NUM_COLS).fill(""));
    let activeRow = 0;
    let activeCol = 0;
    let voiceEnabled = false;
    let speechRate = 1.0;
    let lastRoomValue = "";

    let supabaseClient = null;
    let activeChannel = null;

    const gridEl = document.getElementById("grid");
    const enableVoiceBtn = document.getElementById("enableVoiceBtn");
    const roomInput = document.getElementById("roomInput");
    const connectRoomBtn = document.getElementById("connectRoomBtn");
    const roomStatus = document.getElementById("roomStatus");
    const readRowBtn = document.getElementById("readRowBtn");
    const copyRowBtn = document.getElementById("copyRowBtn");
    const addRowBtn = document.getElementById("addRowBtn");
    const clearGridBtn = document.getElementById("clearGridBtn");
    const rateSlider = document.getElementById("rateSlider");
    const rateValue = document.getElementById("rateValue");

    function speak(text) {
      if (!voiceEnabled || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(String(text));
      utterance.rate = speechRate;
      window.speechSynthesis.speak(utterance);
    }

    function speakToken(ch) {
      speak(ch in SYMBOL_NAMES ? SYMBOL_NAMES[ch] : ch);
    }

    function readCurrentRow() {
      const parts = rows[activeRow]
        .filter((ch) => ch !== "")
        .map((ch) => (ch in SYMBOL_NAMES ? SYMBOL_NAMES[ch] : ch));
      speak(parts.length ? parts.join(" ") : "empty row");
    }

    function ensureRowExists(r) {
      while (rows.length <= r) {
        rows.push(Array(NUM_COLS).fill(""));
      }
    }

    function broadcastGridChange(reason = "update", changedValue = "") {
      if (!activeChannel) return;
      activeChannel.send({
        type: "broadcast",
        event: "grid_update",
        payload: {
          senderId: clientId,
          rows,
          reason,
          changedValue
        }
      });
    }

    async function connectToRoom(roomCode) {
      const cleanRoom = roomCode.trim();
      if (!cleanRoom) {
        roomStatus.textContent = "Enter a room code first";
        roomStatus.classList.remove("connected");
        speak("Enter a room code first");
        return;
      }

      if (
        SUPABASE_URL.includes("YOUR-PROJECT-REF") ||
        SUPABASE_PUBLISHABLE_KEY.includes("YOUR_KEY_HERE")
      ) {
        roomStatus.textContent = "Add Supabase URL & key in index.html first";
        roomStatus.classList.remove("connected");
        speak("Add Supabase URL and key first");
        return;
      }

      if (!supabaseClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      }

      if (activeChannel) {
        await supabaseClient.removeChannel(activeChannel);
        activeChannel = null;
      }

      roomStatus.textContent = `Connecting to "${cleanRoom}"...`;
      roomStatus.classList.remove("connected");

      const channel = supabaseClient.channel(`math-room:${cleanRoom}`, {
        config: { broadcast: { self: false } }
      });

      channel
        .on("broadcast", { event: "grid_update" }, ({ payload }) => {
          if (!payload || payload.senderId === clientId || !Array.isArray(payload.rows)) return;
          rows = payload.rows.map((r) => Array.isArray(r) ? r.slice(0, NUM_COLS) : Array(NUM_COLS).fill(""));
          if (activeRow >= rows.length) {
            activeRow = Math.max(0, rows.length - 1);
          }
          renderGrid(false);
          if (payload.reason === "cell_edit" && payload.changedValue) {
            speak(payload.changedValue in SYMBOL_NAMES ? SYMBOL_NAMES[payload.changedValue] : payload.changedValue);
          } else if (payload.reason === "copy_row") {
            speak("Row copied down");
          } else if (payload.reason === "clear") {
            speak("Grid cleared");
          }
        })
        .subscribe((status) => {
          if (status === "SUBSCRIBED") {
            activeChannel = channel;
            roomStatus.textContent = `Live in room: ${cleanRoom}`;
            roomStatus.classList.add("connected");
            speak(`Connected to room ${cleanRoom}`);
            broadcastGridChange("sync");
          } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
            roomStatus.textContent = "Connection error — check Supabase keys";
            roomStatus.classList.remove("connected");
            speak("Connection error");
          }
        });
    }

    function renderGrid(focusTarget = true) {
      gridEl.innerHTML = "";
      rows.forEach((rowData, rIdx) => {
        const rowDiv = document.createElement("div");
        rowDiv.className = "row";

        const labelDiv = document.createElement("div");
        labelDiv.className = "row-label";
        labelDiv.textContent = `Step ${rIdx + 1}`;
        rowDiv.appendChild(labelDiv);

        rowData.forEach((val, cIdx) => {
          const cell = document.createElement("div");
          cell.className = "cell" + (rIdx === activeRow && cIdx === activeCol ? " active" : "");
          cell.textContent = val;
          cell.tabIndex = rIdx === activeRow && cIdx === activeCol ? 0 : -1;
          cell.dataset.row = rIdx;
          cell.dataset.col = cIdx;

          cell.addEventListener("click", () => {
            activeRow = rIdx;
            activeCol = cIdx;
            renderGrid(true);
            speakToken(rows[activeRow][activeCol]);
          });

          cell.addEventListener("keydown", handleKeyDown);
          rowDiv.appendChild(cell);
        });

        gridEl.appendChild(rowDiv);
      });

      if (focusTarget) {
        const target = gridEl.querySelector(`.cell[data-row="${activeRow}"][data-col="${activeCol}"]`);
        if (target) target.focus();
      }
    }

    function moveTo(r, c, announce = true) {
      ensureRowExists(r);
      activeRow = Math.max(0, Math.min(rows.length - 1, r));
      activeCol = Math.max(0, Math.min(NUM_COLS - 1, c));
      renderGrid(true);
      if (announce) {
        speakToken(rows[activeRow][activeCol]);
      }
    }

    function handleKeyDown(e) {
      if (e.key === "ArrowRight") {
        e.preventDefault();
        moveTo(activeRow, activeCol + 1);
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        moveTo(activeRow, activeCol - 1);
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        moveTo(activeRow + 1, activeCol);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        moveTo(activeRow - 1, activeCol);
      } else if (e.key === "Enter") {
        e.preventDefault();
        moveTo(activeRow + 1, 0);
      } else if (e.key === "Backspace" || e.key === "Delete") {
        e.preventDefault();
        rows[activeRow][activeCol] = "";
        renderGrid(true);
        speak("blank");
        broadcastGridChange("cell_edit", "");
      } else if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1 && /[0-9a-zA-Z+\-*/=^().×÷]/.test(e.key)) {
        e.preventDefault();
        const ch = e.key;
        rows[activeRow][activeCol] = ch;
        renderGrid(true);
        speakToken(ch);
        broadcastGridChange("cell_edit", ch);
      }
    }

    function enableVoice() {
      voiceEnabled = true;
      enableVoiceBtn.textContent = "Voice Enabled";
      const kbd = document.createElement("span");
      kbd.className = "kbd";
      kbd.textContent = "Alt+V";
      enableVoiceBtn.appendChild(kbd);
      moveTo(activeRow, activeCol, false);
      speak("Voice enabled");
    }

    function copyRowDown() {
      const nextRowIndex = activeRow + 1;
      ensureRowExists(nextRowIndex);
      rows[nextRowIndex] = [...rows[activeRow]];
      activeRow = nextRowIndex;
      renderGrid(true);
      speak("Copied row down");
      broadcastGridChange("copy_row");
    }

    function addRow() {
      rows.push(Array(NUM_COLS).fill(""));
      renderGrid(true);
      speak("Row added");
      broadcastGridChange("add_row");
    }

    function clearGrid() {
      rows = Array.from({ length: NUM_ROWS }, () => Array(NUM_COLS).fill(""));
      activeRow = 0;
      activeCol = 0;
      renderGrid(true);
      speak("Cleared");
      broadcastGridChange("clear");
    }

    enableVoiceBtn.addEventListener("click", enableVoice);

    // Speak each character added or removed in the Room Code text field
    roomInput.addEventListener("input", () => {
      const current = roomInput.value;
      if (current.length > lastRoomValue.length) {
        const addedChar = current.slice(lastRoomValue.length).slice(-1);
        speakToken(addedChar);
      } else if (current.length < lastRoomValue.length) {
        speak(current.length === 0 ? "blank" : "deleted");
      }
      lastRoomValue = current;
    });

    roomInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.altKey && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        connectToRoom(roomInput.value);
      }
    });

    connectRoomBtn.addEventListener("click", () => {
      connectToRoom(roomInput.value);
    });

    readRowBtn.addEventListener("click", () => {
      readCurrentRow();
      moveTo(activeRow, activeCol, false);
    });

    copyRowBtn.addEventListener("click", copyRowDown);
    addRowBtn.addEventListener("click", addRow);
    clearGridBtn.addEventListener("click", clearGrid);

    rateSlider.addEventListener("input", () => {
      speechRate = parseFloat(rateSlider.value);
      rateValue.textContent = `${speechRate.toFixed(1)}x`;
      speak(`Speed ${speechRate.toFixed(1)}`);
    });

    // Global Alt+<key> shortcuts for every button
    document.addEventListener("keydown", (e) => {
      if (!e.altKey || e.ctrlKey || e.metaKey) return;
      const key = e.key.toLowerCase();
      if (key === "v") {
        e.preventDefault();
        enableVoice();
      } else if (key === "c") {
        e.preventDefault();
        connectToRoom(roomInput.value);
      } else if (key === "r") {
        e.preventDefault();
        readCurrentRow();
        moveTo(activeRow, activeCol, false);
      } else if (key === "d") {
        e.preventDefault();
        copyRowDown();
      } else if (key === "a") {
        e.preventDefault();
        addRow();
      } else if (key === "x") {
        e.preventDefault();
        clearGrid();
      }
    });

    renderGrid(false);
  </script>
</body>
</html>
