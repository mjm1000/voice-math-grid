<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Math Grid</title>
  <style>
    :root {
      --bg: #121417;
      --panel: #1c2026;
      --cell: #252a33;
      --cell-active: #2d5be3;
      --border: #3a414e;
      --text: #f3f5f8;
      --muted: #aab2c0;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 8px;
    }

    .hint {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      background: var(--panel);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 18px;
    }

    button, label {
      font-size: 0.95rem;
    }

    button {
      background: #2f3642;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }

    button:hover {
      background: #3b4454;
    }

    button.primary {
      background: var(--cell-active);
      border-color: #4f78f0;
    }

    .grid-wrap {
      overflow-x: auto;
      background: var(--panel);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }

    .row-label {
      width: 58px;
      color: var(--muted);
      font-size: 0.85rem;
      user-select: none;
    }

    .cell {
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cell);
      border: 2px solid var(--border);
      border-radius: 6px;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
      outline: none;
      user-select: none;
    }

    .cell.active {
      background: var(--cell-active);
      border-color: #9bb5ff;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Self-Voicing Math Grid</h1>
    <p class="hint">
      Click <strong>Enable Voice</strong> first. Use <strong>Arrow keys</strong> to move, type characters/symbols to enter, <strong>Backspace</strong> to clear, and <strong>Enter</strong> to move down to the next row.
    </p>

    <div class="controls">
      <button id="enableVoiceBtn" class="primary" type="button">Enable Voice</button>
      <button id="readRowBtn" type="button">Read Row</button>
      <button id="copyRowBtn" type="button">Copy Row Down</button>
      <button id="addRowBtn" type="button">Add Row</button>
      <button id="clearGridBtn" type="button">Clear All</button>
      <label>
        Speed:
        <input id="rateSlider" type="range" min="0.6" max="1.6" step="0.1" value="1.0" />
        <span id="rateValue">1.0x</span>
      </label>
    </div>

    <div id="grid" class="grid-wrap" aria-label="Math equation grid"></div>
    <div id="statusLine" class="sr-only" aria-live="off"></div>
  </div>

  <script>
    const NUM_ROWS = 6;
    const NUM_COLS = 14;

    const SYMBOL_NAMES = {
      "": "blank",
      "+": "plus",
      "-": "minus",
      "*": "times",
      "×": "times",
      "/": "divided by",
      "÷": "divided by",
      "=": "equals",
      "^": "to the power of",
      "(": "open parenthesis",
      ")": "close parenthesis",
      ".": "point"
    };

    let rows = Array.from({ length: NUM_ROWS }, () => Array(NUM_COLS).fill(""));
    let activeRow = 0;
    let activeCol = 0;
    let voiceEnabled = false;
    let speechRate = 1.0;

    const gridEl = document.getElementById("grid");
    const enableVoiceBtn = document.getElementById("enableVoiceBtn");
    const readRowBtn = document.getElementById("readRowBtn");
    const copyRowBtn = document.getElementById("copyRowBtn");
    const addRowBtn = document.getElementById("addRowBtn");
    const clearGridBtn = document.getElementById("clearGridBtn");
    const rateSlider = document.getElementById("rateSlider");
    const rateValue = document.getElementById("rateValue");

    function speak(text) {
      if (!voiceEnabled || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(String(text));
      utterance.rate = speechRate;
      window.speechSynthesis.speak(utterance);
    }

    function speakToken(ch) {
      if (ch in SYMBOL_NAMES) {
        speak(SYMBOL_NAMES[ch]);
      } else {
        speak(ch);
      }
    }

    function readCurrentRow() {
      const parts = rows[activeRow]
        .filter((ch) => ch !== "")
        .map((ch) => (ch in SYMBOL_NAMES ? SYMBOL_NAMES[ch] : ch));
      speak(parts.length ? parts.join(" ") : "empty row");
    }

    function ensureRowExists(r) {
      while (rows.length <= r) {
        rows.push(Array(NUM_COLS).fill(""));
      }
    }

    function renderGrid(focusTarget = true) {
      gridEl.innerHTML = "";
      rows.forEach((rowData, rIdx) => {
        const rowDiv = document.createElement("div");
        rowDiv.className = "row";

        const labelDiv = document.createElement("div");
        labelDiv.className = "row-label";
        labelDiv.textContent = `Step ${rIdx + 1}`;
        rowDiv.appendChild(labelDiv);

        rowData.forEach((val, cIdx) => {
          const cell = document.createElement("div");
          cell.className = "cell" + (rIdx === activeRow && cIdx === activeCol ? " active" : "");
          cell.textContent = val;
          cell.tabIndex = rIdx === activeRow && cIdx === activeCol ? 0 : -1;
          cell.dataset.row = rIdx;
          cell.dataset.col = cIdx;

          cell.addEventListener("click", () => {
            activeRow = rIdx;
            activeCol = cIdx;
            renderGrid(true);
            speakToken(rows[activeRow][activeCol]);
          });

          cell.addEventListener("keydown", handleKeyDown);
          rowDiv.appendChild(cell);
        });

        gridEl.appendChild(rowDiv);
      });

      if (focusTarget) {
        const target = gridEl.querySelector(`.cell[data-row="${activeRow}"][data-col="${activeCol}"]`);
        if (target) target.focus();
      }
    }

    function moveTo(r, c, announce = true) {
      ensureRowExists(r);
      activeRow = Math.max(0, Math.min(rows.length - 1, r));
      activeCol = Math.max(0, Math.min(NUM_COLS - 1, c));
      renderGrid(true);
      if (announce) {
        speakToken(rows[activeRow][activeCol]);
      }
    }

    function handleKeyDown(e) {
      if (e.key === "ArrowRight") {
        e.preventDefault();
        moveTo(activeRow, activeCol + 1);
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        moveTo(activeRow, activeCol - 1);
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        moveTo(activeRow + 1, activeCol);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        moveTo(activeRow - 1, activeCol);
      } else if (e.key === "Enter") {
        e.preventDefault();
        moveTo(activeRow + 1, 0);
      } else if (e.key === "Backspace" || e.key === "Delete") {
        e.preventDefault();
        rows[activeRow][activeCol] = "";
        renderGrid(true);
        speak("blank");
      } else if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1 && /[0-9a-zA-Z+\-*/=^().×÷]/.test(e.key)) {
        e.preventDefault();
        const ch = e.key;
        rows[activeRow][activeCol] = ch;
        renderGrid(true);
        speakToken(ch);
      }
    }

    enableVoiceBtn.addEventListener("click", () => {
      voiceEnabled = true;
      enableVoiceBtn.textContent = "Voice Enabled";
      moveTo(activeRow, activeCol, false);
      speak("Voice enabled");
    });

    readRowBtn.addEventListener("click", () => {
      readCurrentRow();
      moveTo(activeRow, activeCol, false);
    });

    copyRowBtn.addEventListener("click", () => {
      const nextRowIndex = activeRow + 1;
      ensureRowExists(nextRowIndex);
      rows[nextRowIndex] = [...rows[activeRow]];
      activeRow = nextRowIndex;
      renderGrid(true);
      speak("Copied row down");
    });

    addRowBtn.addEventListener("click", () => {
      rows.push(Array(NUM_COLS).fill(""));
      renderGrid(true);
      speak("Row added");
    });

    clearGridBtn.addEventListener("click", () => {
      rows = Array.from({ length: NUM_ROWS }, () => Array(NUM_COLS).fill(""));
      activeRow = 0;
      activeCol = 0;
      renderGrid(true);
      speak("Cleared");
    });

    rateSlider.addEventListener("input", () => {
      speechRate = parseFloat(rateSlider.value);
      rateValue.textContent = `${speechRate.toFixed(1)}x`;
      speak(`Speed ${speechRate.toFixed(1)}`);
    });

    renderGrid(false);
  </script>
</body>
</html>
