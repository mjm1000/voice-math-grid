<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Math Grid (Live Room)</title>
  <style>
    :root {
      --bg: #121417;
      --panel: #1c2026;
      --cell: #252a33;
      --cell-active: #2d5be3;
      --border: #3a414e;
      --text: #f3f5f8;
      --muted: #aab2c0;
      --ok: #2ea043;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .app {
      max-width: 1020px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 8px;
    }

    .hint {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      background: var(--panel);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    button, label, input[type="text"] {
      font-size: 0.95rem;
    }

    input[type="text"] {
      background: #121417;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      width: 170px;
    }

    button {
      background: #2f3642;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }

    button:hover {
      background: #3b4454;
    }

    button.primary {
      background: var(--cell-active);
      border-color: #4f78f0;
    }

    .kbd {
      font-size: 0.78rem;
      color: #d6dde8;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: 4px;
    }

    .status {
      font-size: 0.9rem;
      color: var(--muted);
      margin-left: auto;
    }

    .status.connected {
      color: #7ee787;
    }

    .grid-wrap {
      overflow-x: auto;
      background: var(--panel);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }

    .row-label {
      width: 58px;
      color: var(--muted);
      font-size: 0.85rem;
      user-select: none;
    }

    .cell {
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cell);
      border: 2px solid var(--border);
      border-radius: 6px;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
      outline: none;
      user-select: none;
    }

    .cell.active {
      background: var(--cell-active);
      border-color: #9bb5ff;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Self-Voicing Math Grid</h1>
    <p class="hint">
      Click <strong>Enable Voice</strong> (<span class="kbd">Ctrl+Shift+V</span>) first. Typing advances right automatically; press <strong>\</strong> or <strong>~</strong> for square root (<strong>√</strong>); paste (<span class="kbd">Ctrl+V</span> / <span class="kbd">Cmd+V</span>) to fill a row.
    </p>

    <div class="controls">
      <button id="enableVoiceBtn" class="primary" type="button" title="Shortcut: Ctrl+Shift+V">
        Enable Voice <span class="kbd">Ctrl+Shift+V</span>
      </button>
      <label for="roomInput">
        Room Code <span class="kbd">Ctrl+Shift+L</span>:
      </label>
      <input id="roomInput" type="text" placeholder="e.g. grade9-4821" autocomplete="off" title="Shortcut: Ctrl+Shift+L" />
      <button id="connectRoomBtn" type="button" title="Connect using this button or Enter in Room Code">
        Connect Room
      </button>
      <span id="roomStatus" class="status">Offline (local only)</span>
    </div>

    <div class="controls">
      <button id="rowStartBtn" type="button" title="Shortcut: Ctrl+Shift+B">
        Row Start <span class="kbd">Ctrl+Shift+B</span>
      </button>
      <button id="rowEndBtn" type="button" title="Shortcut: Ctrl+Shift+E">
        Row End <span class="kbd">Ctrl+Shift+E</span>
      </button>
      <button id="readRowBtn" type="button" title="Shortcut: Ctrl+Shift+R">
        Read Row <span class="kbd">Ctrl+Shift+R</span>
      </button>
      <button id="copyRowBtn" type="button" title="Shortcut: Ctrl+Shift+D">
        Copy Row Down <span class="kbd">Ctrl+Shift+D</span>
      </button>
      <button id="insertRightBtn" type="button" title="Shortcut: Ctrl+Shift+I">
        Insert Blank Right <span class="kbd">Ctrl+Shift+I</span>
      </button>
      <button id="clearGridBtn" type="button" title="Shortcut: Ctrl+Shift+C">
        Clear All <span class="kbd">Ctrl+Shift+C</span>
      </button>
      <label>
        Speed:
        <input id="rateSlider" type="range" min="0.6" max="1.6" step="0.1" value="1.0" />
        <span id="rateValue">1.0x</span>
      </label>
    </div>

    <div id="grid" class="grid-wrap" aria-label="Math equation grid"></div>
  </div>

  <!-- Supabase JS v2 from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Replace these two values with your Supabase Project URL and Publishable API key
    const SUPABASE_URL = "https://tjzwrqwyyokrnceoqvau.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IbaR-DQ23P8myIDPxEE0Qw_8EC_toie";

    const NUM_ROWS = 6;
    const NUM_COLS = 14;

    const SYMBOL_NAMES = {
      "": "blank",
      "+": "plus",
      "-": "minus",
      "*": "times",
      "×": "times",
      "/": "divided by",
      "÷": "divided by",
      "=": "equals",
      "^": "to the power of",
      "√": "square root",
      "(": "open parenthesis",
      ")": "close parenthesis",
      ".": "point"
    };

    const clientId = "peer-" + Math.random().toString(36).slice(2, 10);
    let rows = Array.from({ length: NUM_ROWS }, () => Array(NUM_COLS).fill(""));
    let activeRow = 0;
    let activeCol = 0;
    let voiceEnabled = false;
    let speechRate = 1.0;
    let lastRoomValue = "";

    let supabaseClient = null;
    let activeChannel = null;

    const gridEl = document.getElementById("grid");
    const enableVoiceBtn = document.getElementById("enableVoiceBtn");
    const roomInput = document.getElementById("roomInput");
    const connectRoomBtn = document.getElementById("connectRoomBtn");
    const roomStatus = document.getElementById("roomStatus");
    const rowStartBtn = document.getElementById("rowStartBtn");
    const rowEndBtn = document.getElementById("rowEndBtn");
    const readRowBtn = document.getElementById("readRowBtn");
    const copyRowBtn = document.getElementById("copyRowBtn");
    const insertRightBtn = document.getElementById("insertRightBtn");
    const clearGridBtn = document.getElementById("clearGridBtn");
    const rateSlider = document.getElementById("rateSlider");
    const rateValue = document.getElementById("rateValue");

    function speak(text, pitch = 1.0) {
      if (!voiceEnabled || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(String(text));
      utterance.rate = speechRate;
      utterance.pitch = pitch;
      window.speechSynthesis.speak(utterance);
    }

    function speakSequence(items, pitch = 1.0) {
      if (!voiceEnabled || !("speechSynthesis" in window) || !items.length) return;
      window.speechSynthesis.cancel();
      items.forEach((item) => {
        const utterance = new SpeechSynthesisUtterance(String(item));
        utterance.rate = speechRate;
        utterance.pitch = pitch;
        window.speechSynthesis.speak(utterance);
      });
    }

    function tokenLabel(ch) {
      return ch in SYMBOL_NAMES ? SYMBOL_NAMES[ch] : ch;
    }

    function speakToken(ch, pitch = 1.0) {
      speak(tokenLabel(ch), pitch);
    }

    function readCurrentRow() {
      const parts = rows[activeRow]
        .filter((ch) => ch !== "")
        .map((ch) => tokenLabel(ch));
      speak(parts.length ? parts.join(" ") : "empty row");
    }

    function ensureRowExists(r) {
      while (rows.length <= r) {
        rows.push(Array(NUM_COLS).fill(""));
      }
    }

    function broadcastGridChange(reason = "update", changedValue = "") {
      if (!activeChannel) return;
      activeChannel.send({
        type: "broadcast",
        event: "grid_update",
        payload: {
          senderId: clientId,
          rows,
          reason,
          changedValue
        }
      });
    }

    async function connectToRoom(roomCode) {
      const cleanRoom = roomCode.trim();
      if (!cleanRoom) {
        roomStatus.textContent = "Enter a room code first";
        roomStatus.classList.remove("connected");
        speak("Enter a room code first");
        return;
      }

      if (
        SUPABASE_URL.includes("YOUR-PROJECT-REF") ||
        SUPABASE_PUBLISHABLE_KEY.includes("YOUR_KEY_HERE")
      ) {
        roomStatus.textContent = "Add Supabase URL & key in index.html first";
        roomStatus.classList.remove("connected");
        speak("Add Supabase URL and key first");
        return;
      }

      if (!supabaseClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      }

      if (activeChannel) {
        await supabaseClient.removeChannel(activeChannel);
        activeChannel = null;
      }

      roomStatus.textContent = `Connecting to "${cleanRoom}"...`;
      roomStatus.classList.remove("connected");

      const channel = supabaseClient.channel(`math-room:${cleanRoom}`, {
        config: { broadcast: { self: false } }
      });

      channel
        .on("broadcast", { event: "grid_update" }, ({ payload }) => {
          if (!payload || payload.senderId === clientId || !Array.isArray(payload.rows)) return;
          rows = payload.rows.map((r) => Array.isArray(r) ? r.slice(0, NUM_COLS) : Array(NUM_COLS).fill(""));
          if (activeRow >= rows.length) {
            activeRow = Math.max(0, rows.length - 1);
          }
          renderGrid(false);
          if (payload.reason === "cell_edit" && payload.changedValue) {
            speak(tokenLabel(payload.changedValue));
          } else if (payload.reason === "delete_shift") {
            speak(payload.changedValue ? tokenLabel(payload.changedValue) : "blank", 1.6);
          } else if (payload.reason === "copy_row") {
            speak("Row copied down");
          } else if (payload.reason === "insert_right") {
            speak("Blank cell inserted");
          } else if (payload.reason === "paste") {
            speak("Equation pasted");
          } else if (payload.reason === "clear") {
            speak("Grid cleared");
          }
        })
        .subscribe((status) => {
          if (status === "SUBSCRIBED") {
            activeChannel = channel;
            roomStatus.textContent = `Live in room: ${cleanRoom}`;
            roomStatus.classList.add("connected");
            speak(`Connected to room ${cleanRoom}`);
            broadcastGridChange("sync");
          } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
            roomStatus.textContent = "Connection error — check Supabase keys";
            roomStatus.classList.remove("connected");
            speak("Connection error");
          }
        });
    }

    function renderGrid(focusTarget = true) {
      gridEl.innerHTML = "";
      rows.forEach((rowData, rIdx) => {
        const rowDiv = document.createElement("div");
        rowDiv.className = "row";

        const labelDiv = document.createElement("div");
        labelDiv.className = "row-label";
        labelDiv.textContent = `Step ${rIdx + 1}`;
        rowDiv.appendChild(labelDiv);

        rowData.forEach((val, cIdx) => {
          const cell = document.createElement("div");
          cell.className = "cell" + (rIdx === activeRow && cIdx === activeCol ? " active" : "");
          cell.textContent = val;
          cell.tabIndex = rIdx === activeRow && cIdx === activeCol ? 0 : -1;
          cell.dataset.row = rIdx;
          cell.dataset.col = cIdx;

          cell.addEventListener("click", () => {
            activeRow = rIdx;
            activeCol = cIdx;
            renderGrid(true);
            speakToken(rows[activeRow][activeCol]);
          });

          cell.addEventListener("keydown", handleKeyDown);
          rowDiv.appendChild(cell);
        });

        gridEl.appendChild(rowDiv);
      });

      if (focusTarget) {
        const target = gridEl.querySelector(`.cell[data-row="${activeRow}"][data-col="${activeCol}"]`);
        if (target) target.focus();
      }
    }

    function moveTo(r, c, announce = true, announceStep = false) {
      ensureRowExists(r);
      activeRow = Math.max(0, Math.min(rows.length - 1, r));
      activeCol = Math.max(0, Math.min(NUM_COLS - 1, c));
      renderGrid(true);
      if (announce) {
        const cellVal = tokenLabel(rows[activeRow][activeCol]);
        if (announceStep) {
          speakSequence([`Step ${activeRow + 1}`, cellVal]);
        } else {
          speak(cellVal);
        }
      }
    }

    function goToRowStart() {
      moveTo(activeRow, 0, true, false);
    }

    function goToRowEnd() {
      ensureRowExists(activeRow);
      const currentRow = rows[activeRow];
      let lastNonEmpty = -1;
      for (let i = currentRow.length - 1; i >= 0; i--) {
        if (currentRow[i] !== "") {
          lastNonEmpty = i;
          break;
        }
      }
      const targetCol = lastNonEmpty === -1 ? 0 : Math.min(NUM_COLS - 1, lastNonEmpty + 1);
      moveTo(activeRow, targetCol, true, false);
    }

    function insertBlankRight() {
      ensureRowExists(activeRow);
      const currentRow = rows[activeRow];
      if (activeCol >= NUM_COLS - 1) {
        speak("At end of row");
        return;
      }
      currentRow.splice(activeCol + 1, 0, "");
      if (currentRow.length > NUM_COLS) {
        currentRow.pop();
      }
      activeCol += 1;
      renderGrid(true);
      speakSequence(["Inserted", "blank"]);
      broadcastGridChange("insert_right", "");
    }

    function deleteAndShiftLeft() {
      ensureRowExists(activeRow);
      const currentRow = rows[activeRow];
      const deletedChar = currentRow[activeCol] || "";
      currentRow.splice(activeCol, 1);
      while (currentRow.length < NUM_COLS) {
        currentRow.push("");
      }
      renderGrid(true);
      speakToken(deletedChar, 1.6);
      broadcastGridChange("delete_shift", deletedChar);
    }

    function normalizeTypedChar(key) {
      if (key === "\\" || key === "~" || key === "√") {
        return "√";
      }
      return key;
    }

    function pasteTextIntoRow(rawText) {
      if (!rawText) return;
      ensureRowExists(activeRow);

      // Take first line if multiple lines were copied, remove spaces, and keep supported math characters
      const firstLine = rawText.split(/\r?\n/)[0].replace(/\s+/g, "");
      const tokens = [];
      for (const ch of firstLine) {
        if (/[0-9a-zA-Z+\-*/=^().×÷\\~√]/.test(ch)) {
          tokens.push(normalizeTypedChar(ch));
        }
      }

      if (!tokens.length) {
        speak("No valid math characters to paste");
        return;
      }

      let col = activeCol;
      let written = 0;
      for (const tok of tokens) {
        if (col >= NUM_COLS) break;
        rows[activeRow][col] = tok;
        col += 1;
        written += 1;
      }

      activeCol = Math.min(NUM_COLS - 1, activeCol + written);
      renderGrid(true);

      if (written < tokens.length) {
        speakSequence([`Pasted ${written} characters`, "row full"]);
      } else {
        speak(`Pasted ${written} characters`);
      }

      broadcastGridChange("paste");
    }

    function handleKeyDown(e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      if (e.key === "ArrowRight") {
        e.preventDefault();
        moveTo(activeRow, activeCol + 1, true, false);
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        moveTo(activeRow, activeCol - 1, true, false);
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        moveTo(activeRow + 1, activeCol, true, true);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        moveTo(activeRow - 1, activeCol, true, true);
      } else if (e.key === "Enter") {
        e.preventDefault();
        moveTo(activeRow + 1, 0, true, true);
      } else if (e.key === "Backspace" || e.key === "Delete") {
        e.preventDefault();
        deleteAndShiftLeft();
      } else if (e.key.length === 1 && /[0-9a-zA-Z+\-*/=^().×÷\\~√]/.test(e.key)) {
        e.preventDefault();
        const ch = normalizeTypedChar(e.key);
        rows[activeRow][activeCol] = ch;
        if (activeCol < NUM_COLS - 1) {
          activeCol += 1;
        }
        renderGrid(true);
        speakToken(ch);
        broadcastGridChange("cell_edit", ch);
      }
    }

    function focusRoomInput() {
      roomInput.focus();
      speak("Room code");
    }

    function enableVoice() {
      voiceEnabled = true;
      enableVoiceBtn.textContent = "Voice Enabled";
      const kbd = document.createElement("span");
      kbd.className = "kbd";
      kbd.textContent = "Ctrl+Shift+V";
      enableVoiceBtn.appendChild(kbd);
      moveTo(activeRow, activeCol, false);
      speak("Voice enabled");
    }

    function copyRowDown() {
      const nextRowIndex = activeRow + 1;
      ensureRowExists(nextRowIndex);
      rows[nextRowIndex] = [...rows[activeRow]];
      activeRow = nextRowIndex;
      renderGrid(true);
      speak("Copied row down");
      broadcastGridChange("copy_row");
    }

    function clearGrid() {
      rows = Array.from({ length: NUM_ROWS }, () => Array(NUM_COLS).fill(""));
      activeRow = 0;
      activeCol = 0;
      renderGrid(true);
      speak("Cleared");
      broadcastGridChange("clear");
    }

    // Allow pasting equations directly into the current row (outside the Room Code box)
    window.addEventListener("paste", (e) => {
      if (document.activeElement === roomInput) return;
      const text = e.clipboardData ? e.clipboardData.getData("text/plain") : "";
      if (text) {
        e.preventDefault();
        pasteTextIntoRow(text);
      }
    });

    enableVoiceBtn.addEventListener("click", enableVoice);
    rowStartBtn.addEventListener("click", goToRowStart);
    rowEndBtn.addEventListener("click", goToRowEnd);
    insertRightBtn.addEventListener("click", insertBlankRight);

    // Speak each character added or removed in the Room Code text field
    roomInput.addEventListener("input", () => {
      const current = roomInput.value;
      if (current.length > lastRoomValue.length) {
        const addedChar = current.slice(lastRoomValue.length).slice(-1);
        speakToken(addedChar);
      } else if (current.length < lastRoomValue.length) {
        speak(current.length === 0 ? "blank" : "deleted", 1.6);
      }
      lastRoomValue = current;
    });

    roomInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
        e.preventDefault();
        connectToRoom(roomInput.value);
      }
    });

    connectRoomBtn.addEventListener("click", () => {
      connectToRoom(roomInput.value);
    });

    readRowBtn.addEventListener("click", () => {
      readCurrentRow();
      moveTo(activeRow, activeCol, false);
    });

    copyRowBtn.addEventListener("click", copyRowDown);
    clearGridBtn.addEventListener("click", clearGrid);

    rateSlider.addEventListener("input", () => {
      speechRate = parseFloat(rateSlider.value);
      rateValue.textContent = `${speechRate.toFixed(1)}x`;
      speak(`Speed ${speechRate.toFixed(1)}`);
    });

    // Global Ctrl+Shift+<key> shortcuts using e.code
    window.addEventListener("keydown", (e) => {
      if (!e.ctrlKey || !e.shiftKey || e.altKey || e.metaKey) return;

      if (e.code === "KeyV") {
        e.preventDefault();
        enableVoice();
      } else if (e.code === "KeyB") {
        e.preventDefault();
        goToRowStart();
      } else if (e.code === "KeyE") {
        e.preventDefault();
        goToRowEnd();
      } else if (e.code === "KeyL") {
        e.preventDefault();
        focusRoomInput();
      } else if (e.code === "KeyR") {
        e.preventDefault();
        readCurrentRow();
        moveTo(activeRow, activeCol, false);
      } else if (e.code === "KeyD") {
        e.preventDefault();
        copyRowDown();
      } else if (e.code === "KeyI") {
        e.preventDefault();
        insertBlankRight();
      } else if (e.code === "KeyC") {
        e.preventDefault();
        clearGrid();
      }
    }, true);

    renderGrid(false);
  </script>
</body>
</html>
